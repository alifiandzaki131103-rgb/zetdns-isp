# Halaman blokir Komdigi Trust Positif.
# Catch-all: menangkap SEMUA Host yang tidak punya vhost sendiri.
# DNS blokir mengarahkan domain ke IP server ini, jadi request masuk
# dengan Host = domain asli yang diblokir.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/lamanlabuh;
    index index.html;

    # selalu tampilkan halaman blokir, apa pun path/domain yang diminta
    location / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    # jangan bocorkan versi nginx
    server_tokens off;

    access_log /var/log/nginx/lamanlabuh-access.log;
    error_log  /var/log/nginx/lamanlabuh-error.log;
}
