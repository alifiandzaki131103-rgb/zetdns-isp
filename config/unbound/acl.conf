# ACL klien rekursif (access-control).
#
# JANGAN commit prefix ISP ke repo ini. File ini di-include oleh
# /etc/unbound/unbound.conf, dan install.sh TIDAK pernah menimpanya
# kalau sudah ada -- supaya ACL produksi tidak hilang saat reinstall.
#
# Isi file ini dikelola dari dashboard (menu "Client access") atau
# diedit langsung. Contoh format:
#
#   access-control: 127.0.0.0/8 allow
#   access-control: 10.0.0.0/8 allow
#   access-control: 0.0.0.0/0 refuse
#
# Template di bawah hanya jaringan privat. Tambahkan prefix pelanggan
# lewat dashboard setelah instalasi.
access-control: 127.0.0.0/8 allow
access-control: 10.0.0.0/8 allow
access-control: 172.16.0.0/12 allow
access-control: 192.168.0.0/16 allow
access-control: 0.0.0.0/0 refuse
